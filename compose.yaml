# zoxy-benchmark v2: containers are the deploy spec. Profiles pick roles:
#   backend     the four-node nginx origin pool (cloud: profile backendN per VM)
#   <proxy>     exactly one proxy-under-test (zoxy|haproxy|nginx|pingora|envoy)
# Removed proxies live in git history, not here: unexercised configs rot (see
# commands.zig parseProxies). The loadgen is not a service: `bench` runs on the
# host (no seccomp vs io_uring) and drives this file over ssh. cadvisor is in
# every profile; the driver polls its /metrics on :8081 for proxy CPU/memory.
#
# Local:  docker compose --profile backend --profile haproxy up -d
# Cloud:  + compose.cloud.yaml (host networking, cpuset, peer IPs).
# The resource limits here are the fairness mechanism.

# Every proxy: 1 CPU, every thread knob hardcoded to 1 (zoxy: ZOXY_WORKERS=1).
# The cloud overlay pins it to core 0.
x-proxy-common: &proxy-common
  cpus: 1
  # 4g: headroom for zoxy's boot-time slot arrays at c10k. Run #25's start
  # failure was EADDRINUSE, not OOM (see PROXY_PORT).
  mem_limit: ${PROXY_MEM:-4g}
  ulimits:
    nofile:
      soft: 1048576
      hard: 1048576
  restart: "no"
  # All four members: a half-ready pool means refused connections.
  depends_on:
    backend0:
      condition: service_healthy
      required: false # cloud: backends run on other VMs, services absent there
    backend1:
      condition: service_healthy
      required: false
    backend2:
      condition: service_healthy
      required: false
    backend3:
      condition: service_healthy
      required: false

# PROXY_PORT: `bench` gives each (profile, proxy) turn its own host port
# (suite.zig proxyPort); rebinding a fixed :8080 after a loaded turn failed with
# EADDRINUSE in cloud (runs #25/#26). The cause was the listener port sitting
# inside ip_local_port_range, so an upstream connection could hold it as a
# source port; cloud-init reserves the pool now. Unset locally. Resolved
# at compose parse time for pingora/envoy, natively by haproxy, and by zoxy's
# entrypoint.
#
# PROXY_TLS_PORT: set only for TLS profiles; empty means no TLS listener at all.
# zoxy preallocates its TLS session pool (68 vs 234 MiB at 0.8.0), so plaintext
# turns must not carry one. Healthchecks stay on the plaintext listener; bench's
# warm probe covers TLS.
#
# The cert is generated per run into ./proxies/tls (suite.zig
# ensureTlsMaterial): ECDSA P-256, the only key type zoxy accepts.

# Healthcheck = a real request through the proxy to /1k, so `up --wait` waits
# for serving, not merely running (a leftover container could answer instead).
# It runs in the proxy's cgroup, so the timing must be identical for all five.
x-healthcheck-timing: &healthcheck-timing
  interval: 30s
  timeout: 2s
  retries: 3
  start_period: 30s
  start_interval: 250ms

# Probes must already exist in each image (nothing is installed into a measured
# container): haproxy and nginx (alpine) have busybox wget.
x-healthcheck-wget: &healthcheck-wget
  <<: *healthcheck-timing
  test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:${PROXY_PORT:-8080}/1k"]

# The rest have no wget, but their bash supports /dev/tcp.
x-healthcheck-bash: &healthcheck-bash
  <<: *healthcheck-timing
  test:
    - CMD
    - bash
    - -c
    - 'exec 3<>/dev/tcp/127.0.0.1/${PROXY_PORT:-8080} && printf "GET /1k HTTP/1.1\r\nHost: healthcheck\r\nConnection: close\r\n\r\n" >&3 && grep -q "^HTTP/1.[01] 200" <&3'

# --------------------------------------------------------------- the origin --
# Four backends: picking a pool member is part of a proxy's job; every proxy
# round-robins. Profile `backend` starts all four (local); `backendN` starts one
# (cloud, one per VM under host networking). Only backend0 publishes a port,
# for curling by hand.
x-backend: &backend
  image: nginx:1.31-alpine
  # Matches cloud/variables.tf backend_cores; becomes worker_processes.
  cpus: ${BACKEND_CPUS:-2}
  mem_limit: ${BACKEND_MEM:-1g}
  environment:
    # rendered by the image's envsubst hook; must be an integer
    BACKEND_CPUS: ${BACKEND_CPUS:-2}
    NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
  volumes:
    - ./backend/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
    - ./backend/10-gen-bodies.sh:/docker-entrypoint.d/10-gen-bodies.sh:ro
  tmpfs:
    - /srv/bodies # canned 64B/1k/10k/100k responses live in RAM
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/64"]
    interval: 2s
    timeout: 2s
    retries: 15

services:
  # ---------------------------------------------------------------- origin --
  backend0:
    <<: *backend
    container_name: backend0
    profiles: [backend, backend0]
    ports:
      - "9000:9000"

  backend1:
    <<: *backend
    container_name: backend1
    profiles: [backend, backend1]

  backend2:
    <<: *backend
    container_name: backend2
    profiles: [backend, backend2]

  backend3:
    <<: *backend
    container_name: backend3
    profiles: [backend, backend3]

  # ------------------------------------------------------- proxies under test --
  # All five: L7 HTTP/1.1 reverse proxy to the backend0..3 pool, keep-alive
  # both legs, one access log line per request.
  #
  # Access logs (numbers before they were enabled are not comparable):
  #   - Sink is /tmp/access.log, not stdout: a stalled docker log pipe blocks
  #     the event loop. haproxy has no file target, so its fd 1 is redirected.
  #   - Each proxy uses its own stock format (~90-250 bytes per line).
  #   - zoxy drops lines instead of stalling; bench reports
  #     zoxy_access_log_dropped (suite.zig accessLogDropped).
  # container_name == service name == cAdvisor's `name` label (report join).
  zoxy:
    <<: *proxy-common
    build:
      context: ./proxies/zoxy
      args:
        # Defaults are a source build of main; `bench` always passes all three.
        ZOXY_FLAVOUR: ${ZOXY_FLAVOUR:-source}
        ZOXY_REF: ${ZOXY_REF:-main}
        ZOXY_OPTIMIZE: ${ZOXY_OPTIMIZE:-ReleaseFast}
        # SIMD on, as zoxy ships. The release flavour is x86_64_v3 regardless;
        # /etc/zoxy/build-info is authoritative.
        ZOXY_CPU: ${ZOXY_CPU:-native}
    # The tag is every input that changes the binary.
    image: zoxy-bench/zoxy:${ZOXY_REF:-main}-${ZOXY_FLAVOUR:-source}-${ZOXY_OPTIMIZE:-ReleaseFast}-${ZOXY_CPU:-native}
    container_name: zoxy
    profiles: [zoxy]
    # Default seccomp plus the io_uring syscalls (denied since engine 25.0), not
    # unconfined, so filter overhead matches. libxev has no epoll fallback.
    security_opt:
      - seccomp=./proxies/zoxy/seccomp-iouring.json
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
      memlock: -1 # io_uring ring memory counts against memlock on kernels <5.12
    # One process (ZOXY_WORKERS=1) for thread parity. zoxy caps admission at
    # limits.conn_slots and sheds past it; no other proxy has such a cap. No
    # DNS: the entrypoint resolves BACKENDS to IPs. `pick` is pinned to
    # round-robin (zoxy's default is p2c).
    environment:
      BACKENDS: backend0:9000,backend1:9000,backend2:9000,backend3:9000
      ZOXY_WORKERS: 1
      ZOXY_CONN_SLOTS: ${ZOXY_CONN_SLOTS:-}
      ZOXY_UPSTREAM_SLOTS: ${ZOXY_UPSTREAM_SLOTS:-}
      # TLS session pool, set by TLS profiles only. One engine per admitted
      # connection, so anything under conn_slots sheds.
      ZOXY_TLS_ENGINES: ${ZOXY_TLS_ENGINES:-}
      # Bytes per relay direction, set by the large-body profile only: it
      # sets how many recv->send round trips one body costs, and doubles
      # zoxy's relay pool when raised. Unset elsewhere keeps zoxy's 16 KiB
      # default; zoxy refuses above that on a TLS turn.
      ZOXY_RELAY_BUFFER_BYTES: ${ZOXY_RELAY_BUFFER_BYTES:-}
      # Rendered by entrypoint.sh; an empty PROXY_TLS_PORT omits TLS.
      PROXY_PORT: ${PROXY_PORT:-8080}
      PROXY_TLS_PORT: ${PROXY_TLS_PORT:-}
    volumes:
      - ./proxies/zoxy/config.template.json:/etc/zoxy/config.template.json:ro
      - ./proxies/tls:/etc/bench/tls:ro
    ports:
      - "8080:8080"
      - "8443:8443"
    healthcheck: *healthcheck-bash

  haproxy:
    <<: *proxy-common
    image: haproxy:3.4-alpine
    container_name: haproxy
    profiles: [haproxy]
    environment:
      # Hostnames locally; the cloud overlay swaps in IPs (no 127.0.0.11).
      # One var per member: haproxy's env expansion cannot split a list.
      BACKEND0_ADDR: backend0:9000
      BACKEND1_ADDR: backend1:9000
      BACKEND2_ADDR: backend2:9000
      BACKEND3_ADDR: backend3:9000
      # Expanded natively by haproxy.cfg; compose cannot reach a mounted file.
      PROXY_PORT: ${PROXY_PORT:-8080}
      # Empty on plaintext turns: haproxy.cfg's `.if` drops the TLS frontend.
      PROXY_TLS_PORT: ${PROXY_TLS_PORT:-}
    # haproxy cannot log to a path, so fd 1 (`log stdout`) goes to the file;
    # stderr still reaches `docker logs` for reportStartFailure. The image
    # entrypoint adds -W -db; `exec` keeps haproxy as PID 1.
    entrypoint: ["sh", "-c"]
    command:
      - exec docker-entrypoint.sh haproxy -f /usr/local/etc/haproxy/haproxy.cfg >> /tmp/access.log
    volumes:
      - ./proxies/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      # haproxy's `crt` needs chain and key in one file: bench.pem.
      - ./proxies/tls:/etc/bench/tls:ro
    ports:
      - "8080:8080"
      - "8443:8443"
    healthcheck: *healthcheck-wget




  envoy:
    <<: *proxy-common
    image: envoyproxy/envoy:v1.36-latest
    container_name: envoy
    profiles: [envoy]
    # --concurrency 1: envoy sizes workers from host CPUs, not the cgroup.
    # envoy.yaml has no env substitution, so sed bakes the ports in at compose
    # parse time; plaintext turns delete @TLS_BEGIN@..@TLS_END@. `$$` escapes a
    # dollar for the shell.
    entrypoint: ["sh", "-c"]
    command:
      - >-
        tls='/@TLS_BEGIN@/,/@TLS_END@/d';
        [ -n "${PROXY_TLS_PORT:-}" ] && tls='s/@TLS_PORT@/${PROXY_TLS_PORT}/';
        sed -e 's/@PORT@/${PROXY_PORT:-8080}/' -e "$$tls"
        /etc/envoy/envoy.yaml.template > /tmp/envoy.yaml &&
        exec envoy -c /tmp/envoy.yaml --concurrency 1
    volumes:
      - ./proxies/envoy/envoy.yaml.template:/etc/envoy/envoy.yaml.template:ro
      - ./proxies/tls:/etc/bench/tls:ro
    ports:
      - "8080:8080"
      - "8443:8443"
    healthcheck: *healthcheck-bash

  nginx:
    <<: *proxy-common
    # Stock image: proxy_pass to a keepalive upstream, worker_processes 1.
    image: nginx:1.31-alpine
    container_name: nginx
    profiles: [nginx]
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      # Read by envsubst when rendering the template, not by compose.
      PROXY_PORT: ${PROXY_PORT:-8080}
      # Empty on plaintext turns: 25-tls.sh deletes the TLS server block.
      PROXY_TLS_PORT: ${PROXY_TLS_PORT:-}
    volumes:
      - ./proxies/nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      # Shared by both server blocks so plaintext and TLS proxy identically.
      - ./proxies/nginx/origin-location.conf:/etc/nginx/origin-location.conf:ro
      # Runs after the image's envsubst hook (name order).
      - ./proxies/nginx/25-tls.sh:/docker-entrypoint.d/25-tls.sh:ro
      - ./proxies/tls:/etc/bench/tls:ro
    ports:
      - "8080:8080"
      - "8443:8443"
    healthcheck: *healthcheck-wget

  pingora:
    <<: *proxy-common
    # Pingora is a framework: proxies/pingora builds a minimal L7 proxy on it
    # (1 worker thread, upstreams resolved once, round-robin).
    build:
      context: ./proxies/pingora
      args:
        PINGORA_TARGET_CPU: ${PINGORA_TARGET_CPU:-native}
    image: zoxy-bench/pingora-http:0.8
    container_name: pingora
    profiles: [pingora]
    environment:
      # Interpolated at compose parse time; see PROXY_PORT above.
      LISTEN: 0.0.0.0:${PROXY_PORT:-8080}
      # Empty on plaintext turns, so main.rs adds no TLS endpoint.
      TLS_LISTEN: ${PROXY_TLS_PORT:+0.0.0.0:}${PROXY_TLS_PORT:-}
      UPSTREAMS: backend0:9000,backend1:9000,backend2:9000,backend3:9000
    volumes:
      - ./proxies/tls:/etc/bench/tls:ro
    ports:
      - "8080:8080"
      - "8443:8443"
    healthcheck: *healthcheck-bash

  # ------------------------------------------- per-host exporters (all roles) --
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: cadvisor
    profiles: [monitoring, backend, zoxy, haproxy, envoy, nginx, pingora]
    # The proxy host's cAdvisor is the run's only source of container CPU and
    # memory, and its name label catches an imposter on :8080. Needs the
    # overlay2 graphdriver (see cloud/cloud-init.yaml.tftpl), else names are
    # lost. Keep in sync with compose.cloud.yaml, which replaces command.
    command:
      - --disable_metrics=advtcp,cpu_topology,disk,diskIO,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp
      # fixed 1s sampling; dynamic housekeeping backs off up to 60s
      - --housekeeping_interval=1s
      - --allow_dynamic_housekeeping=false
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8081:8080"

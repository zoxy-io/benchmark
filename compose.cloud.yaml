# Cloud overlay: docker compose -f compose.yaml -f compose.cloud.yaml ...
#  1. network_mode: host, so no bridge NAT on the measured path.
#  2. cpuset pinning for the proxy.
#  3. extra_hosts maps backend0..3 to BACKEND0_IP..BACKEND3_IP (passed by
#     `bench suite`). Each backend VM runs only its own backendN.

x-host-net: &host-net
  network_mode: host
  ports: !reset []

# Anchored so every proxy dials the same pool.
x-backend-hosts: &backend-hosts
  - "backend0:${BACKEND0_IP}"
  - "backend1:${BACKEND1_IP}"
  - "backend2:${BACKEND2_IP}"
  - "backend3:${BACKEND3_IP}"

services:
  backend0:
    <<: *host-net
  backend1:
    <<: *host-net
  backend2:
    <<: *host-net
  backend3:
    <<: *host-net

  zoxy:
    <<: *host-net
    cpuset: "0"
    extra_hosts: *backend-hosts

  haproxy:
    <<: *host-net
    cpuset: "0"
    extra_hosts: *backend-hosts
    environment:
      # IP literals keep haproxy off the bridge-only 127.0.0.11 resolver
      BACKEND0_ADDR: ${BACKEND0_IP}:9000
      BACKEND1_ADDR: ${BACKEND1_IP}:9000
      BACKEND2_ADDR: ${BACKEND2_IP}:9000
      BACKEND3_ADDR: ${BACKEND3_IP}:9000

  envoy:
    <<: *host-net
    cpuset: "0"
    extra_hosts: *backend-hosts

  nginx:
    <<: *host-net
    cpuset: "0"
    # resolved once at startup via these /etc/hosts entries
    extra_hosts: *backend-hosts

  pingora:
    <<: *host-net
    cpuset: "0"
    extra_hosts: *backend-hosts

  cadvisor:
    <<: *host-net
    # :8081, clear of the proxy's :8080. This replaces the whole command: keep
    # the flags identical to compose.yaml.
    command:
      - --port=8081
      - --disable_metrics=advtcp,cpu_topology,disk,diskIO,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp
      - --housekeeping_interval=1s
      - --allow_dynamic_housekeeping=false
    environment:
      # the image HEALTHCHECK defaults to :8080; `up --wait` would abort
      CADVISOR_HEALTHCHECK_URL: http://localhost:8081/healthz


# L7 HTTP reverse proxy :8080 -> the backend0..backend3 pool, plus a TLS
# listener on :8443 for the TLS profiles only (parity with zoxy's build — every
# proxy now parses HTTP/1.1 and reverse-proxies requests, and every proxy grows
# the same second listener on a TLS turn). Thread count is hardcoded to 1
# (1 CPU) — explicit, not autodetection. Access logging is ON, to stdout, in
# this proxy's own stock format (see `option httplog`).
global
    nbthread 1

    # nginx's listener runs `multi_accept on` — drain the whole accept queue
    # in one epoll wakeup rather than trickle it out — and haproxy's analog is
    # tune.maxaccept, left untouched until now. Its default is 4 consecutive
    # accepts per listener wakeup before the loop goes back to other work; at
    # nbthread 1, with a ramp that deliberately drives past the knee, that cap
    # can throttle how fast the accept backlog empties under a burst. -1
    # removes the limit entirely, matching nginx's unbounded drain.
    #
    # Doc caveat, not a free win: "this is not the case anymore with the
    # multi-queue... It should normally not be needed to tweak this value."
    # Needs the same before/after evidence maxconn got below before trusting
    # it — this is the change, not yet the proof.
    tune.maxaccept -1

    # Access log -> fd 1, which compose REDIRECTS to /tmp/access.log.
    #
    # Every proxy here logs to a file rather than to the container's stdout,
    # because stdout is a pipe dockerd drains and a proxy that fills it blocks
    # on the log write — measuring docker's log driver instead of the proxy.
    # haproxy is the one that cannot be pointed at a file by configuration:
    # its log targets are syslog, a UNIX socket, a ring, or a file DESCRIPTOR,
    # and there is no path form. `stdout` is haproxy's own alias for `fd@1`, so
    # the redirect in compose.yaml's `command` is what turns that descriptor
    # into the file. Nothing is lost from `docker logs` by doing it: haproxy
    # writes its startup [NOTICE] lines to stderr (verified — stdout carried
    # only access lines), which compose leaves alone.
    #
    # `format raw` matters. Without it haproxy prepends syslog framing —
    # priority, its own timestamp, hostname, tag — to every line, on the hot
    # path, to be parsed back off by nobody. `raw` emits the log-format string
    # and nothing else.
    #
    # `daemon` is the syslog FACILITY, which the directive's grammar still
    # requires even when the framing that would carry it is switched off.
    log stdout format raw daemon
    # Left HIGH on purpose, after two attempts to lower it made things worse.
    #
    # The fairness argument for lowering it was that zoxy is given conn_slots
    # 11,464 while haproxy was told it could accept 200,000. That argument is
    # weaker than it looks: zoxy's slots are a hard PREALLOCATION of memory
    # pools, haproxy's maxconn is an admission CEILING drawn lazily from a pool.
    # Matching the numbers is not equivalence, it is a handicap.
    #
    # And it is measurably harmful. TIME_WAIT on the loadgen at the c10k abort,
    # same ramp order every time, only maxconn changing:
    #
    #     200,000  ->  tw 3        (run #20)
    #      12,000  ->  tw 8,532    (run #21)
    #      24,000  ->  tw 11,859   (run #22)
    #
    # Lowering it made haproxy start closing connections, so the generator
    # reconnected instead of holding keep-alive open. That corrupts what is being
    # measured even on a run that completes, and raising 12k to 24k did not
    # recover it. 200,000 is the only value observed with no churn.
    #
    # It does imply more than the box has if every slot were used — at the default
    # tune.bufsize that is ~6.8 GB against a 1 GB container — but buffers come from
    # a pool on demand, and the measured behaviour says the ceiling is not what
    # hurts. Revisit with cAdvisor memory evidence, not with arithmetic.
    maxconn 200000

defaults
    mode http
    # Inherit the `log stdout` target declared in `global`, and log every
    # exchange in haproxy's STOCK HTTP format — the one `option httplog`
    # produces, unmodified. Each proxy here logs in its own idiomatic format
    # rather than a common one, so the line each writes is the line its own
    # operators would read; the cost of that line is part of what the run
    # measures, and the formats differ in length (roughly 90-250 bytes across
    # the five), which has to be read WITH the numbers rather than forgotten.
    #
    # httplog's line carries the full timer breakdown (Tq/Tw/Tc/Tr/Tt), the
    # termination state and both queue depths. That is the most expensive line
    # in the comparison, and it is the one haproxy ships.
    log global
    option httplog
    # keep-alive both legs (haproxy's default in http mode); http-reuse safe
    # pools idle server connections across clients for parity with the other
    # L7 proxies (nginx keepalive, envoy/traefik/pingora pools, zoxy idle lists).
    option http-keep-alive
    http-reuse safe
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout http-request 60s
    timeout http-keep-alive 60s

# Runtime DNS via Docker's embedded resolver. Without this, haproxy resolves
# a hostname once at config-parse time and *fatally exits* if the name isn't
# ready yet — a startup race that intermittently aborts the whole benchmark
# run. Control-plane only (periodic background lookups), never on the hot path.
#
# 127.0.0.11 only exists on Docker BRIDGE networks. The cloud overlay runs
# host networking, where an unreachable resolver eventually invalidates the
# libc-resolved address and haproxy marks the server DOWN (~99% failures a
# minute into the ramp). Hence BACKENDn_ADDR below: local = `backendN:9000`
# (hostname -> this resolver is live and used), cloud = `<ip>:9000` (IP
# literal -> haproxy does no runtime DNS at all and this section is inert).
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

# PROXY_PORT varies per (profile, proxy) turn on the cloud fleet — see
# compose.yaml's x-proxy-common for why — and haproxy's native env-var
# expansion (the same mechanism BACKENDn_ADDR below already relies on) reads
# it directly; this file is a static mount, so compose's own `${}`
# interpolation never reaches it.
frontend fe_plain
    bind 0.0.0.0:${PROXY_PORT}
    default_backend be_origin

# The TLS listener, and ONLY on a TLS profile: `bench` sets PROXY_TLS_PORT for
# a TLS turn and leaves it empty otherwise, so a plaintext turn parses this file
# to exactly the configuration it parsed before TLS existed here. That is the
# point of the conditional rather than a second always-bound listener — the
# plaintext profiles' numbers, memory included, must not move because a feature
# they do not use was added.
#
# `.if !streq(...)` and not `.if defined(...)`: compose always sets the variable,
# empty when there is no TLS turn, and an empty-but-set variable is `defined`.
#
# Same backend, same everything else: haproxy terminates here and the upstream
# leg stays plaintext, which is what the other four do too — zoxy's TLS is
# inbound-only, so an encrypted upstream would be a job it cannot do.
#
# `crt` takes one file holding the chain AND the key, which is why the run's
# generator writes bench.pem as well as the split pair.
#
# ssl-min-ver/ssl-max-ver pin TLS 1.3. The generator (zrk, on Zig's std TLS
# client) offers nothing else, so this changes no handshake — it states what is
# being measured, and makes a future generator that DOES offer 1.2 fail
# visibly here rather than quietly measuring a different protocol on one proxy.
#
# `alpn http/1.1` is NOT cosmetic, and it is the one setting here that was
# found by testing rather than reasoned out: haproxy's TLS bind advertises
# `h2,http/1.1` by default, and curl duly negotiated HTTP/2 against it while
# nginx and envoy stayed on HTTP/1.1. The generator offers no ALPN at all, so
# every proxy falls back to HTTP/1.1 today and nothing changes — but the day
# anything here learns ALPN, that default would silently make this comparison
# one proxy on HTTP/2 against four on HTTP/1.1. Every other number this
# benchmark has ever published is HTTP/1.1.
.if !streq("$PROXY_TLS_PORT","")
frontend fe_tls
    bind 0.0.0.0:${PROXY_TLS_PORT} ssl crt /etc/bench/tls/bench.pem ssl-min-ver TLSv1.3 ssl-max-ver TLSv1.3 alpn http/1.1
    default_backend be_origin
.endif

# Four origins, round-robin. `balance roundrobin` was already the setting when
# there was one server to round-robin between; it is pinned here rather than
# left implicit because it now decides something — every proxy in the
# comparison is held to strict round-robin so the numbers stay proxy-vs-proxy
# and not LB-algorithm-vs-LB-algorithm.
#
# No `check` on any server, deliberately. Active health checking is a whole
# second axis of unfairness (haproxy and envoy ship active checks, nginx passive
# ones on by DEFAULT — see proxies/nginx — and pingora as written does
# not), and every backend is up for the entire run — a member that failed
# mid-ramp should show up as errors in the numbers, not be silently routed
# around by some proxies and not others.
backend be_origin
    balance roundrobin
    # init-addr libc,none: resolve immediately via libc when the backend is
    # already up (fast path, parity with the other proxies); if it isn't, start
    # anyway and let `resolvers docker` resolve at runtime instead of aborting.
    server b0 "${BACKEND0_ADDR}" resolvers docker init-addr libc,none
    server b1 "${BACKEND1_ADDR}" resolvers docker init-addr libc,none
    server b2 "${BACKEND2_ADDR}" resolvers docker init-addr libc,none
    server b3 "${BACKEND3_ADDR}" resolvers docker init-addr libc,none

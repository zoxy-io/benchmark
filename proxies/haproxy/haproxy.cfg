# L7 reverse proxy -> backend0..3; TLS frontend only on TLS profiles.
# 1 thread (explicit, not autodetected). Stock httplog access logging.
global
    nbthread 1

    # Unbounded accept drain per wakeup, matching nginx's `multi_accept on`
    # (default 4). Unproven: needs before/after evidence like maxconn.
    tune.maxaccept -1

    # fd 1, redirected to /tmp/access.log by compose.yaml: haproxy has no
    # file log target, and a stdout pipe would block on dockerd.
    # `format raw` skips per-line syslog framing; `daemon` is required syntax.
    log stdout format raw daemon
    # Keep HIGH: lowering it caused connection churn at c10k (TIME_WAIT on
    # the loadgen: 200k -> 3, 12k -> 8,532, 24k -> 11,859; runs #20-22).
    # maxconn is a lazy ceiling, not a preallocation like zoxy's conn_slots.
    maxconn 200000

defaults
    mode http
    # Stock `option httplog` format (each proxy logs in its own format; line
    # lengths differ, ~90-250 bytes, and are part of the measured cost).
    log global
    option httplog
    # Pool idle server connections across clients, for parity with the other
    # proxies' upstream pools.
    option http-keep-alive
    http-reuse safe
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout http-request 60s
    timeout http-keep-alive 60s

# Runtime DNS so a not-yet-ready hostname does not abort startup. Inert on the
# cloud fleet, where BACKENDn_ADDR is an IP literal (127.0.0.11 exists only on
# bridge networks; relying on it there marked servers DOWN).
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

# PROXY_PORT: haproxy's own env expansion (static mount, no compose
# interpolation); see compose.yaml x-proxy-common.
frontend fe_plain
    bind 0.0.0.0:${PROXY_PORT}
    default_backend be_origin

# TLS listener only when PROXY_TLS_PORT is non-empty, so plaintext turns are
# unchanged. `streq`, not `defined`: compose always sets it, maybe empty.
# Upstream stays plaintext (zoxy terminates inbound only). TLS 1.3 pinned.
# `alpn http/1.1` is required: haproxy advertises h2 by default, and the
# comparison must stay HTTP/1.1 on every proxy.
.if !streq("$PROXY_TLS_PORT","")
frontend fe_tls
    bind 0.0.0.0:${PROXY_TLS_PORT} ssl crt /etc/bench/tls/bench.pem ssl-min-ver TLSv1.3 ssl-max-ver TLSv1.3 alpn http/1.1
    default_backend be_origin
.endif

# Strict round-robin, as on every proxy. No `check`: health checking differs
# per proxy, and a failed member should show up as errors.
backend be_origin
    balance roundrobin
    # init-addr libc,none: resolve now if possible, else start and resolve at
    # runtime via `resolvers docker`.
    server b0 "${BACKEND0_ADDR}" resolvers docker init-addr libc,none
    server b1 "${BACKEND1_ADDR}" resolvers docker init-addr libc,none
    server b2 "${BACKEND2_ADDR}" resolvers docker init-addr libc,none
    server b3 "${BACKEND3_ADDR}" resolvers docker init-addr libc,none

[package]
name = "pingora-http"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pingora-http"
path = "src/main.rs"

[dependencies]
# The `openssl` feature is required: without a TLS feature, pingora-core 0.8
# compiles `add_tls` but panics at the first handshake (noop_tls).
pingora-core = { version = "0.8", features = ["openssl"] }
pingora-proxy = { version = "0.8", features = ["openssl"] }
async-trait = "0.1"
# Access-log timestamps (already a pingora-core dep). default-features = false
# avoids pulling iana-time-zone, which is not in the lockfile; logs are UTC.
chrono = { version = "0.4", default-features = false, features = ["now", "std"] }

[profile.release]
opt-level = 3
codegen-units = 1

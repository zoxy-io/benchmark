[package]
name = "pingora-http"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pingora-http"
path = "src/main.rs"

[dependencies]
# Pingora is a framework, not a proxy — we build the L7 HTTP proxy in main.rs.
# pingora-proxy carries the ProxyHttp trait + http_proxy_service (the HTTP/1.1
# reverse-proxy state machine and upstream connection pool); pingora-core
# carries Server / ServerConf / HttpPeer. Pin the minor here; bump to bench a
# newer Pingora.
#
# The `openssl` FEATURE is not optional decoration, and it was found the
# expensive way: without a TLS feature, pingora-core 0.8 still compiles
# `add_tls` and still accepts the certificate paths — and then panics at the
# first handshake, inside `protocols/tls/noop_tls`, with "not implemented: No
# tls feature was specified". A TLS listener that binds, accepts a connection,
# reads the ClientHello and closes without answering is exactly the failure a
# benchmark cannot afford to discover from a row of zeroes.
#
# openssl rather than boringssl or rustls: the Dockerfile already installs
# libssl-dev to build against and libssl3 to run against, and it puts pingora in
# the same company as nginx and haproxy here (envoy links BoringSSL, zoxy its
# own libcrypto), so the comparison spans the stacks these proxies actually
# ship with.
pingora-core = { version = "0.8", features = ["openssl"] }
pingora-proxy = { version = "0.8", features = ["openssl"] }
async-trait = "0.1"
# Access-log timestamps. Already in the tree as a pingora-core dependency, so
# this pulls in no new crate — it only makes the dependency direct, since
# main.rs now names it. Formatting a calendar timestamp per request is work the
# other four proxies' access logs all do; doing it with epoch integers instead
# would make pingora's line cheaper than theirs for no reason but convenience.
#
# `default-features = false` is load-bearing: chrono's default `clock` feature
# drags in iana-time-zone to discover the LOCAL zone, a crate that is not in
# this lockfile because pingora-core takes chrono with `alloc` only. `now` is
# the feature that provides `Utc::now()` without any of that — this log stamps
# UTC, so the local zone is never consulted.
chrono = { version = "0.4", default-features = false, features = ["now", "std"] }

[profile.release]
opt-level = 3
codegen-units = 1

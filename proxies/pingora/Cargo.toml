[package]
name = "pingora-http"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pingora-http"
path = "src/main.rs"

[dependencies]
# Pingora is a framework, not a proxy — we build the L7 HTTP proxy in main.rs.
# pingora-proxy carries the ProxyHttp trait + http_proxy_service (the HTTP/1.1
# reverse-proxy state machine and upstream connection pool); pingora-core
# carries Server / ServerConf / HttpPeer. Pin the minor here; bump to bench a
# newer Pingora.
#
# `openssl` feature (phase-3a-ztls): pingora-core ships NO TLS backend by
# default (bare `pingora-core = "0.5"` compiles a panic-stub `tls` module —
# TlsSettings/add_tls_with_settings don't exist without a backend feature).
# openssl over boringssl: matches the stock OpenSSL already pulled in for the
# build (libssl-dev/libssl3 below), no extra cmake/Go toolchain needed.
pingora-core = { version = "0.5", features = ["openssl"] }
pingora-proxy = { version = "0.5", features = ["openssl"] }
async-trait = "0.1"

[profile.release]
opt-level = 3
codegen-units = 1

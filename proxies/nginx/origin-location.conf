# The proxying half of nginx's config, included by BOTH server blocks (the
# plaintext listener and the TLS one) in nginx.conf.template.
#
# It is a separate file for one reason: the two listeners must proxy
# identically. The TLS profile is c1k with TLS on and nothing else changed, so a
# `proxy_set_header` that made it into one server block and not the other would
# turn "what TLS costs" into a comparison of two different reverse proxies —
# and it would be invisible, because both would still serve 200s.
#
# Mounted straight into /etc/nginx rather than through the image's templates/
# directory: there is nothing here for envsubst to substitute.

location / {
    proxy_pass http://origin;
    # keep-alive to the upstream requires HTTP/1.1 with the per-hop
    # Connection header cleared (nginx defaults to HTTP/1.0 + close).
    # As nginx v1.29.7 use http 1.1 by default https://blog.nginx.org/blog/keep-alive-to-upstreams-is-now-default-in-nginx-1-29-7
    # coment these lines
    #proxy_http_version 1.1;
    #proxy_set_header Connection "";
}

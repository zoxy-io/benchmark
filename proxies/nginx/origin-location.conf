# Shared by both server blocks so plaintext and TLS proxy identically.
# No envsubst needed, so mounted directly into /etc/nginx.
location / {
    proxy_pass http://origin;
# nginx >= 1.29.7 defaults to HTTP/1.1 upstream keep-alive:
# https://blog.nginx.org/blog/keep-alive-to-upstreams-is-now-default-in-nginx-1-29-7
}

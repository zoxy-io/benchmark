# CI: run the nightly's own commands early and cheaply, so a broken push does
# not cost a night.
#   check  — fmt, unit tests, and the nightly's exact cross-compile.
#   config — compose/terraform/workflow syntax.
#   smoke  — the suite end-to-end (profile.zig `smoke`) on local docker,
#            against the stock nginx and haproxy images.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs, except on main: every main commit gets a verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: build + test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Same Zig version as nightly.yml and publish.yml (hard minimum in
      # build.zig.zon).
      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: zig fmt
        working-directory: bench
        run: zig fmt --check build.zig src

      # Must run on Linux: remote.zig tests call `std.os.linux.kill`.
      - name: zig build test
        working-directory: bench
        run: zig build test --summary all

      # Must match nightly.yml's "Build bench" exactly: -Dcpu matters (a named
      # target alone is baseline), and ReleaseFast miscompiles don't show in
      # Debug.
      - name: Build bench (static x86_64-linux-musl, as the nightly does)
        working-directory: bench
        run: zig build -Dtarget=x86_64-linux-musl -Dcpu=x86_64_v3 -Doptimize=ReleaseFast

      # A dynamic binary would only fail later, on the loadgen VM.
      - name: Assert the artifact is a static ELF
        run: |
          set -euo pipefail
          out="$(file -b bench/zig-out/bin/bench)"
          echo "$out"
          case "$out" in
            *"ELF 64-bit LSB executable, x86-64"*"statically linked"*) ;;
            *) echo "::error::bench is not a static x86_64 ELF: $out"; exit 1 ;;
          esac

      # No args must exit 2 (CONTRACT.md); also proves the ReleaseFast musl
      # binary reaches `main` (d4ad5fa did not).
      - name: Exit codes match CONTRACT.md
        run: |
          set -euo pipefail
          ./bench/zig-out/bin/bench && rc=0 || rc=$?
          echo "no-args exit: $rc"
          [ "$rc" -eq 2 ] || { echo "::error::expected exit 2, got $rc"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: bench-binary
          path: bench/zig-out/bin/bench
          retention-days: 3

  config:
    name: compose + terraform + workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Every profile plus the cloud overlay. The env vars mirror envPrefix()
      # (suite.zig) so compose does not interpolate them to empty.
      - name: docker compose config
        env:
          PROXY_PORT: "18080"
          PROXY_TLS_PORT: "19080"
          PROXY_MEM: "4g"
          ZOXY_REF: "release"
          BACKEND0_IP: "10.0.0.13"
          BACKEND1_IP: "10.0.0.14"
          BACKEND2_IP: "10.0.0.15"
          BACKEND3_IP: "10.0.0.16"
        run: |
          set -euo pipefail
          for p in backend backend0 backend1 backend2 backend3 \
                   zoxy haproxy nginx pingora envoy monitoring; do
            echo "--- profile $p"
            docker compose --profile "$p" config -q
          done
          echo "--- cloud overlay (every profile at once)"
          docker compose -f compose.yaml -f compose.cloud.yaml --profile '*' config -q

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          # Matches nightly.yml and the devenv pin.
          tofu_version: 1.12.3
          tofu_wrapper: false

      # No remote state or credential here; init still installs providers.
      - name: tofu fmt + validate
        working-directory: cloud
        run: |
          set -euo pipefail
          tofu fmt -check -recursive -diff
          tofu init -backend=false -input=false
          tofu validate

      - name: actionlint
        uses: raven-actions/actionlint@v2
        with:
          fail-on-error: true

  smoke:
    name: local suite end-to-end
    runs-on: ubuntu-24.04
    # Backstop only; the suite bounds itself.
    timeout-minutes: 25
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: bench-binary
          path: bin

      - run: chmod +x bin/bench

      # The suite asserts the fd limit before ramping (ramp.assertFdLimit).
      - name: Raise the fd limit
        run: ulimit -n 65536 && ulimit -n

      # nginx and haproxy only: stock images (no compile), and zoxy's io_uring
      # seccomp profile would make the gate flaky. Covers the harness, not the
      # proxies.
      - name: bench suite --local --profile smoke
        run: |
          set -euo pipefail
          ./bin/bench suite --local --profile smoke \
            --proxies nginx,haproxy --runid ci-${{ github.run_id }}

      - name: bench report
        run: ./bin/bench report "results/ci-${{ github.run_id }}/smoke" --profile smoke

      # The nightly's other rendering paths; --dry-run posts nothing.
      - name: bench index + notify --dry-run
        run: |
          set -euo pipefail
          ./bin/bench index "results/ci-${{ github.run_id }}" --out _site
          ./bin/bench notify "results/ci-${{ github.run_id }}" --dry-run

      # A rendered report can still be empty. Both missing proxies and
      # `status: degraded` turns are fatal, so missing cAdvisor data fails CI.
      - name: The run actually measured something
        run: |
          set -euo pipefail
          d="results/ci-${{ github.run_id }}/smoke"
          test -s "$d/report.json" || { echo "::error::no report.json"; exit 1; }
          test -s "$d/report.html"
          test -s "$d/profile.json" || { echo "::error::no profile.json"; exit 1; }
          python3 - "$d" <<'PY'
          import json, pathlib, sys
          d = pathlib.Path(sys.argv[1])
          report = json.loads((d / "report.json").read_text())
          profile = json.loads((d / "profile.json").read_text())

          bad = []

          # A proxy missing from report.json never reached a ramp.
          proxies = report.get("proxies") or []
          names = sorted(p.get("name") for p in proxies)
          print("proxies in report:", names)
          if names != ["haproxy", "nginx"]:
              bad.append(f"expected both proxies, got {names}")

          for p in proxies:
              print(f"  {p['name']}: sustained={p.get('sustained')} "
                    f"p50={p.get('latency_ms', {}).get('p50')} mem={p.get('mem')}")
              if not p.get("sustained"):
                  bad.append(f"{p['name']} sustained no load — the ramp did not run")

          # The suite's own per-turn verdict; `notes` says why.
          for name, t in sorted((profile.get("proxies") or {}).items()):
              print(f"  {name}: status={t.get('status')} "
                    f"cadvisor_samples={t.get('cadvisor_samples')} notes={t.get('notes')}")
              if t.get("status") != "ok":
                  bad.append(f"{name} turn is {t.get('status')}: {t.get('notes')}")

          if bad:
              for b in bad:
                  print(f"::error::{b}")
              sys.exit(1)
          print("all turns ok")
          PY

      # profile.json shows which stage each proxy died in.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-run
          path: |
            results/
            _site/
          retention-days: 7

      - name: docker compose down
        if: always()
        run: docker compose --profile '*' down --remove-orphans || true

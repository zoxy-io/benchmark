name: publish

# Everything downstream of the measurement: render a run's artifacts into
# report.html, build the Pages site, deploy it, and post to Discord.
#
# A REUSABLE workflow with two entry points, so the render/deploy path has ONE
# implementation:
#
#   * `workflow_call` — nightly.yml calls this once its bench job has uploaded
#     the raw artifact. That job now only measures.
#   * `workflow_dispatch` — re-publish any past run. Used when a rendering bug
#     is fixed and the live site should show the fix without spending a fleet
#     run on new numbers.
#
# The split is measure/publish rather than nightly/republish deliberately: a
# republish that re-implemented rendering would drift from the nightly's, and
# the whole reason to republish is usually that the rendering changed.
#
# The INPUT is an Actions run id, not a bench run id. The raw data lives in
# that run's `bench-<runid>` artifact (90-day retention), and the bench run id
# is read back out of the artifact rather than passed — one input that cannot
# disagree with itself.

on:
  workflow_call:
    inputs:
      source-run:
        description: 'Actions run id holding the bench-<runid> artifact'
        required: true
        type: string
      notify:
        description: 'Post the summary to Discord'
        required: false
        type: boolean
        default: true
    secrets:
      DISCORD_WEBHOOK:
        required: false

  workflow_dispatch:
    inputs:
      source-run:
        description: 'Actions run id to re-publish (blank = latest successful nightly)'
        required: false
        type: string
      notify:
        description: 'Post the summary to Discord (off by default when re-publishing)'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # `actions: read` is what lets download-artifact reach ANOTHER run's
    # artifact — the re-publish case. `id-token: write` is deploy-pages' own
    # authentication, and nothing else: see the Discord step on why this job
    # mints no cloud token.
    permissions:
      contents: read
      actions: read
      id-token: write
      pages: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      # Absolute, and NOT `./bench` — that path is the source directory.
      BENCH: ${{ github.workspace }}/bin/bench
      # The only secret this job holds, and the only cloud-ish config it needs:
      # no bucket, no service account, no IAM token. Read by `bench notify`.
      # Never passed to a VM, never echoed.
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Native, unlike the nightly's build: that one cross-compiles a static
      # musl binary because it is SHIPPED to the loadgen VM. Nothing here
      # leaves the runner.
      - name: Build bench
        working-directory: bench
        run: zig build -Doptimize=ReleaseFast

      - name: Stage the binary
        run: install -D -m 0755 bench/zig-out/bin/bench "$BENCH"

      # ----------------------------------------------------------- the data --

      # Blank on a dispatch means "the newest nightly that succeeded", which is
      # what someone re-publishing after a rendering fix almost always wants,
      # and saves them looking a run id up by hand.
      - name: Resolve the source run
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.source-run }}
        run: |
          set -euo pipefail
          run_id="$REQUESTED"
          if [ -z "$run_id" ]; then
            run_id="$(gh run list --workflow nightly.yml --status success \
              --limit 1 --json databaseId --jq '.[0].databaseId')"
            [ -n "$run_id" ] || { echo "::error::no successful nightly run to publish"; exit 1; }
            echo "no run given — using the latest successful nightly: $run_id"
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download the run artifact
        uses: actions/download-artifact@v8
        with:
          pattern: bench-*
          run-id: ${{ steps.src.outputs.run-id }}
          github-token: ${{ github.token }}
          path: results
          merge-multiple: true

      # The bench run id is whatever directory the artifact carries, rather
      # than a second input that could contradict the first.
      - name: Identify the run
        id: meta
        run: |
          set -euo pipefail
          runid="$(find results -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | head -1)"
          [ -n "$runid" ] || { echo "::error::artifact contained no run directory"; exit 1; }
          echo "runid=$runid" >> "$GITHUB_OUTPUT"
          echo "publishing run $runid"

      - name: Compute the Pages base URL
        id: base
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
          repo="${GITHUB_REPOSITORY#*/}"
          echo "base=https://${owner}.github.io/${repo}/" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------- the render --

      # `--base-url` makes a proxy's ".hgrm" download link absolute rather than
      # relative to wherever the page is opened from. Pages is now the only
      # place report.html is served, so a bare link would resolve there too —
      # but an absolute one also survives the file being saved or re-hosted,
      # and it is the same URL `bench notify` puts in the Discord embed.
      - name: Render the per-profile reports
        id: report
        env:
          RUNID: ${{ steps.meta.outputs.runid }}
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          # Driven by what the run actually PRODUCED, not by a profile list: a
          # run cut short mid-way still has whole profiles worth publishing,
          # and re-publishing an old run must not need to know what that
          # night's BENCH_PROFILES happened to be.
          rendered=0
          for d in "results/$RUNID"/*/; do
            p="$(basename "$d")"
            if [ ! -f "$d/profile.json" ]; then
              echo "no artifacts for $p — skipping"
              continue
            fi
            "$BENCH" report "results/$RUNID/$p" --profile "$p" --base-url "${BASE}${p}/"
            rendered=$((rendered + 1))
          done
          if [ "$rendered" -eq 0 ]; then
            echo "::error::no profile produced artifacts — nothing to publish"
            exit 1
          fi
          echo "rendered $rendered profile(s)"

      # deploy-pages replaces the site wholesale, so the trend chart's history
      # lives IN the published site and has to be carried forward by hand:
      # download the currently-published history.ndjson and hand it to `bench
      # index`, which re-emits it with this run's rows appended (`bench index`
      # merges by run id, so re-publishing a run already in history replaces
      # its rows rather than doubling them).
      #
      # Best-effort by design — a first run has no site to read, and a 404 must
      # not be a failure.
      - name: Fetch the published history
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          if curl -fsS --max-time 60 -o history.ndjson "${BASE}history.ndjson"; then
            echo "carried forward $(wc -l < history.ndjson) history row(s)"
          else
            echo "no published history yet — starting fresh"
            : > history.ndjson
          fi

      - name: Build the Pages site
        env:
          RUNID: ${{ steps.meta.outputs.runid }}
        run: |
          set -euo pipefail
          "$BENCH" index "results/$RUNID" --out _site --history history.ndjson

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # ---------------------------------------------------------- the post --

      # Only when asked. The nightly asks; a re-publish does not, because the
      # night's post already went out and a second one reporting the same
      # numbers reads as a second run.
      #
      # No cloud credential here, deliberately. This job never touches Yandex:
      # the results arrive as an Actions artifact and the report it links is the
      # copy deployed to Pages a few steps up. It briefly did mint an IAM token
      # — `bench notify` used to upload report.html public-read to Object
      # Storage for a per-run immutable link — and that broke the moment the
      # job gained `environment: github-pages`, because the environment rewrites
      # the OIDC `sub` claim to `repo:<owner>/<repo>:environment:github-pages`
      # and the federated credential is bound to the `ref:refs/heads/main`
      # subject. The fix was to delete the dependency rather than bind a second
      # subject: an immutable link is not worth a cloud credential in a job that
      # otherwise handles nothing but files already on this runner.
      - name: Notify Discord
        if: inputs.notify
        continue-on-error: true
        env:
          RUNID: ${{ steps.meta.outputs.runid }}
          BASE_URL: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          # No webhook configured (a fork, or a first run) — render and validate
          # the post without sending it, rather than failing the night.
          dry=()
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "DISCORD_WEBHOOK is unset — dry run"
            dry=(--dry-run)
          fi
          "$BENCH" notify "results/$RUNID" \
            --history history.ndjson \
            --base-url "$BASE_URL" \
            "${dry[@]}"

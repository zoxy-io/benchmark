name: publish

# Render a run's artifacts, deploy the Pages site, and post to Discord.
# One implementation for both callers: nightly.yml (workflow_call) and manual
# re-publishing of a past run (workflow_dispatch). Input is an Actions run id;
# the bench run id is read from its `bench-<runid>` artifact.

on:
  workflow_call:
    inputs:
      source-run:
        description: 'Actions run id holding the bench-<runid> artifact'
        required: true
        type: string
      notify:
        description: 'Post the summary to Discord'
        required: false
        type: boolean
        default: true
    secrets:
      DISCORD_WEBHOOK:
        required: false

  workflow_dispatch:
    inputs:
      source-run:
        description: 'Actions run id to re-publish (blank = latest successful nightly)'
        required: false
        type: string
      notify:
        description: 'Post the summary to Discord (off by default when re-publishing)'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # `actions: read` lets download-artifact reach another run's artifact;
    # `id-token: write` is only for deploy-pages.
    permissions:
      contents: read
      actions: read
      id-token: write
      pages: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      # Absolute; `./bench` is the source directory.
      BENCH: ${{ github.workspace }}/bin/bench
      # The only secret here. Never pass it to a VM or echo it.
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      # A variable, not a credential; only used to link the run's results.tar.
      BENCH_BUCKET: ${{ vars.BENCH_BUCKET }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Native bench-publish (report/index/notify only); nothing leaves the
      # runner. See bench/src/publish_main.zig.
      - name: Build bench-publish
        working-directory: bench
        run: zig build publish -Doptimize=ReleaseFast

      - name: Stage the binary
        run: install -D -m 0755 bench/zig-out/bin/bench-publish "$BENCH"

      # ----------------------------------------------------------- the data --

      # Blank on dispatch = newest successful nightly.
      - name: Resolve the source run
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.source-run }}
        run: |
          set -euo pipefail
          run_id="$REQUESTED"
          if [ -z "$run_id" ]; then
            run_id="$(gh run list --workflow nightly.yml --status success \
              --limit 1 --json databaseId --jq '.[0].databaseId')"
            [ -n "$run_id" ] || { echo "::error::no successful nightly run to publish"; exit 1; }
            echo "no run given — using the latest successful nightly: $run_id"
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download the run artifact
        uses: actions/download-artifact@v8
        with:
          pattern: bench-*
          run-id: ${{ steps.src.outputs.run-id }}
          github-token: ${{ github.token }}
          path: results
          merge-multiple: true

      # The bench run id comes from the artifact, not a second input.
      - name: Identify the run
        id: meta
        run: |
          set -euo pipefail
          runid="$(find results -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | head -1)"
          [ -n "$runid" ] || { echo "::error::artifact contained no run directory"; exit 1; }
          echo "runid=$runid" >> "$GITHUB_OUTPUT"
          echo "publishing run $runid"

      - name: Compute the Pages base URL
        id: base
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
          repo="${GITHUB_REPOSITORY#*/}"
          echo "base=https://${owner}.github.io/${repo}/" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------- the render --

      # `--base-url` makes ".hgrm" links absolute (same URL `bench notify` uses).
      - name: Render the per-profile reports
        id: report
        env:
          RUNID: ${{ steps.meta.outputs.runid }}
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          # Driven by what the run produced, so partial and old runs publish.
          rendered=0
          for d in "results/$RUNID"/*/; do
            p="$(basename "$d")"
            if [ ! -f "$d/profile.json" ]; then
              echo "no artifacts for $p — skipping"
              continue
            fi
            "$BENCH" report "results/$RUNID/$p" --profile "$p" --base-url "${BASE}${p}/"
            rendered=$((rendered + 1))
          done
          if [ "$rendered" -eq 0 ]; then
            echo "::error::no profile produced artifacts — nothing to publish"
            exit 1
          fi
          echo "rendered $rendered profile(s)"

      # deploy-pages replaces the site, so carry history.ndjson forward;
      # `bench index` merges by run id. A 404 (first run) is not a failure.
      - name: Fetch the published history
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          if curl -fsS --max-time 60 -o history.ndjson "${BASE}history.ndjson"; then
            echo "carried forward $(wc -l < history.ndjson) history row(s)"
          else
            echo "no published history yet — starting fresh"
            : > history.ndjson
          fi

      # Links the loadgen's uploaded results.tar (bench/CONTRACT.md), which
      # includes error logs. No link when BENCH_BUCKET is unset (a fork).
      - name: Build the Pages site
        env:
          RUNID: ${{ steps.meta.outputs.runid }}
        run: |
          set -euo pipefail
          results_url=""
          if [ -n "${BENCH_BUCKET:-}" ]; then
            results_url="https://storage.yandexcloud.net/$BENCH_BUCKET/runs/$RUNID/results.tar"
          else
            echo "BENCH_BUCKET is unset — the page will carry no raw-data link"
          fi
          "$BENCH" index "results/$RUNID" --out _site --history history.ndjson \
            --results-url "$results_url"

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # ---------------------------------------------------------- the post --

      # Only when asked: a re-publish must not post the same night twice.
      # No cloud credential: the `github-pages` environment changes the OIDC
      # `sub` claim, which the federated credential is not bound to.
      - name: Notify Discord
        if: inputs.notify
        continue-on-error: true
        env:
          RUNID: ${{ steps.meta.outputs.runid }}
          BASE_URL: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          # No webhook (fork or first run): dry run rather than failing.
          dry=()
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "DISCORD_WEBHOOK is unset — dry run"
            dry=(--dry-run)
          fi
          "$BENCH" notify "results/$RUNID" \
            --history history.ndjson \
            --base-url "$BASE_URL" \
            "${dry[@]}"

# Retry a failed nightly: re-run only its failed jobs (a failed `bench` is a
# full fleet retry). run_attempt < 3 = original run plus two retries.
name: nightly retry

on:
  workflow_run:
    workflows: [nightly]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-24.04
    steps:
      - name: Re-run the failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run rerun ${{ github.event.workflow_run.id }} --failed --repo ${{ github.repository }}
